<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DiaCare – Result</title>
  <style>
    body { margin: 0; min-height: 100vh; font-family: "Open Sans", Arial, sans-serif; color: #fff; text-align: center;
           background: #111 url("{{ url_for('static', filename='wallpaper.jpg') }}") center / cover fixed; }
    .results { margin-top: 100px; text-shadow: 2px 2px 4px #000; }
    img { max-width: min(420px, 90vw); border-radius: 12px; }
    a { color: #fff; display: inline-block; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="results">
    {% if prediction == 1 %}
      <h1>Higher risk of diabetes</h1>
      <img src="{{ url_for('static', filename='diabetes.webp') }}" alt="Diabetes">
    {% else %}
      <h1>Lower risk of diabetes</h1>
      <img src="{{ url_for('static', filename='no-diabetes.webp') }}" alt="No diabetes">
    {% endif %}
    <p>Model-estimated probability: {{ "%.0f"|format(probability * 100) }}%</p>
    <p><small>Not a medical diagnosis – please consult a doctor.</small></p>
    <a href="{{ url_for('home') }}">&larr; Try again</a>
  </div>
</body>
</html>
